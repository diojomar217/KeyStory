<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; background: #f7fafc; color: #1a202c; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
      .card { max-width: 420px; width: 100%; background: white; border-radius: 18px; padding: 32px; box-shadow: 0 24px 60px rgba(0,0,0,.08); }
      h1 { margin: 0 0 12px; font-size: 1.75rem; }
      p { margin: 0 0 20px; line-height: 1.6; }
      a { color: #2563eb; text-decoration: none; }
      a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>The guest uploader can still queue photos locally. Once you reconnect, saved photos will upload automatically.</p>
      <p><a href="/">Return to the app</a></p>
    </div>
  </body>
</html>
